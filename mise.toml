#:schema https://mise.en.dev/schema/mise.json

[tool_alias]
varlock = "github:dmno-dev/varlock"

[tools]
bun = "latest"
varlock = { version = "latest", version_prefix = "varlock@" }
prettier = "latest"
betterleaks = "latest"
lefthook = "latest"
task = "latest"
worktrunk = "latest"
"github:brettinternet/noon" = "latest"
"github:brettinternet/tell" = "latest"
"github:korotovsky/slack-mcp-server" = { version = "latest", bin = "slack-mcp-server" }

[settings]
npm.package_manager = "bun"

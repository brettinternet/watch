---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  init:
    desc: Install tools, create local files, and install hooks
    cmds:
      - task: mise
      - task: worktree

  mise:
    desc: Install workstation dependencies
    cmds:
      - mise trust -q -a
      - mise install -q
    preconditions:
      - sh: command -v mise
        msg: Mise is not installed

  worktree:
    desc: Prepare a checkout without enabling scheduled jobs
    cmds:
      - task: deps
      - task: env:init
      - task: lefthook

  deps:
    desc: Install Bun dependencies
    cmd: mise exec bun -- bun install --frozen-lockfile

  slack:
    desc: "Extract this machine's Slack stealth tokens into .env.local, e.g. task setup:slack -- acme"
    cmd: python3 scripts/slack-tokens {{.CLI_ARGS}}

  tell:
    desc: Route this clone's Tell notifications to Pushover via .git/tell.yaml
    vars:
      FILE:
        sh: echo "$(git rev-parse --path-format=absolute --git-common-dir)/tell.yaml"
    status:
      - test -f "{{.FILE}}"
    cmds:
      - |
        cat >> "{{.FILE}}" <<'EOF'
        # Personal Tell routing for this clone (worktrees share it). Credentials come from .env.local.
        notify:
          via: pushover
        pushover:
          token_env: PUSHOVER_TOKEN
          user_env: PUSHOVER_USER
          retry: 2m # emergency priority repeats until acknowledged or expired
          expire: 1h
        EOF
      - echo "Wrote {{.FILE}}"

  env:init:
    desc: Create an empty private .env.local if missing, then validate
    cmds:
      - test -f .env.local || (touch .env.local && chmod 600 .env.local)
      - task: env:check

  env:check:
    desc: Validate and resolve the Varlock environment
    cmd: '{{.ENV_RUN}} -- true && echo "Environment valid"'

  env:encrypt:
    desc: Encrypt one value for use in .env.local
    cmd: mise exec varlock -- varlock encrypt

  env:run:
    desc: Run a command with the Varlock environment
    cmd: "{{.ENV_RUN}} -- {{.CLI_ARGS}}"

  lefthook:
    desc: Install Lefthook
    cmd: mise exec lefthook -- lefthook install

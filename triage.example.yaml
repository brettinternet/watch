# Per-clone triage config. `task init` copies this to the gitignored triage.local.yaml.
# Deep-merges over triage.yaml (lists replace). See README.
llm:
  agent: claude # claude | pi | command
# Grouped by kind, then named; the name sets the env prefix, e.g. SLACK_ACME_.
sources:
  slack:
    acme: { url: https://acme.slack.com } # task setup:slack -- acme
    # side: { channel_types: dm, mentions_only: true }
    # acme: { url: https://acme.slack.com, priority_channels: { incidents: high } }
  # github:
  #   acme: { repos: [owner/repo] }
  # linear:
  #   acme: {} # LINEAR_ACME_API_KEY
  # jira:
  #   acme: { url: https://acme.atlassian.net } # JIRA_ACME_EMAIL, JIRA_ACME_API_TOKEN
  hackernews:
    top: { min_points: 1000 }
  feed:
    githubstatus: { url: https://www.githubstatus.com/history.atom }
    claudestatus: { url: https://status.claude.com/history.atom }
    cloudflarestatus: { url: https://www.cloudflarestatus.com/history.atom }
    # Any source takes instructions for the LLM and a cron schedule (default: every triage run).
    # rust:
    #   url: https://blog.rust-lang.org/feed.xml
    #   instructions: Releases and security advisories are normal; skip everything else.
    #   schedule: "0 9 * * 1-5"
  kev:
    mine: { match: [Apple, Chromium] }
  # dependabot:
  #   mine: { owners: [your-github-login] }
  # earthquake:
  #   home: { lat: 0.0, lon: 0.0, km: 150 }
  # airquality:
  #   home: { lat: 0.0, lon: 0.0 }
  # weather:
  #   home: { lat: 0.0, lon: 0.0 }
  # traffic:
  #   home: # TRAFFIC_HOME_API_KEY
  #     url: https://511.example.gov
  #     areas: [{ lat: 0.0, lon: 0.0, km: 10 }]
# Always include messages from these people, at no less than this priority (empty means normal).
# vips:
#   sam@acme.com: high

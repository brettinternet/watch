version: 1
vars_file: .noon.vars # per-clone schedule/timeout overrides; gitignored

jobs:
  triage:
    description: >
      Summarize new unread messages from configured sources and notify by priority. Outside
      work_hours (triage.yaml), only urgent items notify and the rest waits for work hours.
      Noop (78) means nothing new or nothing worth notifying.
    schedule: "${TRIAGE_SCHEDULE:-*/15 * * * *}"
    timeout: "${TRIAGE_TIMEOUT:-10m}"
    missed: skip
    overlap: skip
    noop_exit_code: 78
    run: [mise, exec, --, task, --exit-code, triage] # pass 78 through, not task's 201
    on_failure: [./scripts/on-failure]

  update:
    description: >
      Fast-forward this checkout to its upstream and install dependencies.
      Noop (78) means already current.
    schedule: "${UPDATE_SCHEDULE:-0 * * * *}"
    timeout: 5m
    missed: skip
    overlap: skip
    noop_exit_code: 78
    run: [./scripts/update]
    on_failure: [./scripts/on-failure]

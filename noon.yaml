version: 1
vars_file: .noon.vars # per-clone schedule/timeout overrides; gitignored

definitions:
  triage: &triage
    description: >
      Summarize new unread messages from configured sources and notify by priority.
      Noop (78) means nothing new or nothing at or above notify.min_priority.
    timeout: "${TRIAGE_TIMEOUT:-10m}"
    missed: skip
    overlap: skip
    noop_exit_code: 78
    run: [mise, exec, --, task, --exit-code, triage] # pass 78 through, not task's 201
    on_failure: [./scripts/on-failure]

# The two triage schedules must not overlap: concurrent runs share cursors and notify twice.
jobs:
  triage:
    <<: *triage
    schedule: "${TRIAGE_SCHEDULE:-*/15 8-17 * * *}"

  triage-after-hours:
    <<: *triage
    schedule: "${TRIAGE_AFTER_HOURS_SCHEDULE:-0 18-23/2,0-7/2 * * *}"

  update:
    description: >
      Fast-forward this checkout to its upstream and install dependencies.
      Noop (78) means already current.
    schedule: "${UPDATE_SCHEDULE:-0 * * * *}"
    timeout: 5m
    missed: skip
    overlap: skip
    noop_exit_code: 78
    run: [./scripts/update]
    on_failure: [./scripts/on-failure]

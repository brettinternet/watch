# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  ENV_RUN: >-
    mise exec varlock -- varlock run
    -p "{{.ROOT_DIR}}/.env.schema" -p "{{.ROOT_DIR}}/.env.local"

includes:
  setup: .taskfiles/setup.yaml

tasks:
  default:
    silent: true
    cmd: task -l

  init:
    desc: Install dependencies and setup environment
    aliases: [setup]
    cmds:
      - task: setup:init

  triage:
    desc: Collect, summarize, and notify once; `task triage -- --dry-run` previews without side effects
    cmd: ./scripts/triage {{.CLI_ARGS}}

  agenda:
    desc: Notify today's meetings once; `task agenda -- --dry-run` previews without notifying
    cmd: ./scripts/agenda {{.CLI_ARGS}}

  followups:
    desc: List open follow-ups; `-- done <id>` dismisses one, `-- snooze <id> 1d` defers it
    cmd: mise exec bun -- bun src/followups.ts {{.CLI_ARGS}}

  doctor:
    desc: Check setup, credentials, and scheduler state without side effects
    cmd: "{{.ENV_RUN}} -- bun src/doctor.ts"
    preconditions:
      - sh: test -f .env.local
        msg: .env.local is missing; run task init

  slack:mcp:
    desc: Serve Slack MCP over stdio for agent sessions; `-- <source>` picks a workspace
    silent: true
    vars:
      PRIMARY:
        sh: dirname "$(git rev-parse --path-format=absolute --git-common-dir)"
    cmd: >-
      mise exec -- varlock run --no-redact-stdout --filter "SLACK_*"
      -p "{{.PRIMARY}}/.env.schema" -p "{{.PRIMARY}}/.env.local"
      -- bun src/slack-mcp.ts "{{.PRIMARY}}" {{.CLI_ARGS}}

  test:
    desc: Run unit tests
    cmd: mise exec bun -- bun test

  typecheck:
    desc: Typecheck TypeScript
    cmd: mise exec bun -- bun x tsc

  check:
    desc: Run all project checks
    cmds:
      - mise exec prettier -- prettier --check .
      - task: typecheck
      - task: test

  check:staged:
    desc: Run checks only for staged files
    aliases: [check-staged]
    cmd: mise exec lefthook -- lefthook run pre-commit

  fix:
    desc: Fix all project files
    cmds:
      - mise exec prettier -- prettier --write .
